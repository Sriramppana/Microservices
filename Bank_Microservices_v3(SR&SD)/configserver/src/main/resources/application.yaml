spring:
  application:
    name: configserver

  profiles:
    active: git  # Using Git backend

  cloud:
    config:
      server:
        git:
          uri: https://github.com/Sriramppana/Microservices-config.git
          default-label: main
          timeout: 5000
          clone-on-start: true
          force-pull: true

        # Symmetric key (dev). For production use JKS keystore (see notes below).
        encrypt:
          key: "45D81EC1EF61DF9AD8D3E5BB397F9"

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

management:
  endpoints:
    web:
      exposure:
        include: "*"
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true

encrypt:
  key: "45D81EC1EF61DF9AD8D3E5BB397F9"

server:
  port: 8071