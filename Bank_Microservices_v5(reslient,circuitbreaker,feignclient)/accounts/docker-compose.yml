services:
  accounts:
    image: "sriramappana1998/accounts:m1"
    container_name: "accounts-ms"
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits:
          memory: 700m
    networks:
      - rambank

  loans:
    image: "sriramappana1998/loans:m1"
    container_name: "loans-ms"
    ports:
      - "8090:8090"
    deploy:
      resources:
        limits:
          memory: 700m
    networks:
      - rambank

  cards:
    image: "sriramappana1998/cards:m1"
    container_name: "cards-ms"
    ports:
      - "9000:9000"
    deploy:
      resources:
        limits:
          memory: 700m
    networks:
      - rambank

networks:
  rambank:
    driver: bridge
