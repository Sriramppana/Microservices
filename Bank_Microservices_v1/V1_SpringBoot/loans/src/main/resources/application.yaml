spring:
  application:
    name: loans
  datasource:
    url: jdbc:h2:mem:testdb
    driverClassName: org.h2.Driver
    username: sa
    password: sa
  h2:
    console:
      enabled: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  port: 8090

config:
  import:
    - "application_qa.yml"
    - "application_prod.yml"
  profiles:
    active:
      - "qa"

build:
  version: "3.0"

loans :
  message: "Welcome to RamBank loans related local APIs "
