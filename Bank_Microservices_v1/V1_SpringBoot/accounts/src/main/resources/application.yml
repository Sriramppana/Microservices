server:
  port: 8080

config:
  import:
    - "application_qa.yml"
    - "application_prod.yml"
  profiles:
    active:
      - "qa"
      -
spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: sa

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none
    show-sql: true
    defer-datasource-initialization: true

  sql:
    init:
      mode: always

build:
  version: "3.0"

accounts:
  message: "Welcome to RamBank accounts related local APIs"
  contactDetails:
